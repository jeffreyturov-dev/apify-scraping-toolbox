# Smithery.ai connector config — Apify Scraping Toolbox
# 12 pay-per-event data actors reachable through the branded Adaga solutions
# MCP facade (thin pass-through to the Apify API, your token, your billing).
startCommand:
  type: "http"
  url: "https://adagasolutions.lu/mcp"
  configSchema:
    type: "object"
    required:
      - apifyToken
    properties:
      apifyToken:
        type: "string"
        title: "Apify API Token"
        description: "Token from console.apify.com Settings > Integrations (free plan works)."
  headers:
    Authorization: "Bearer ${apifyToken}"
  exampleConfig:
    apifyToken: "apify_api_xxxxxxxxxxxxxxxx"
